<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🌤️ Weather App</h1>
        <p>Check the current weather of any city</p>
    </header>


    <!-- Weather Search -->
    <main>

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>

        </div>


        <!-- Weather Information -->
        <div id="weatherCard" class="weather-card">

            <h2 id="cityName">Search for a city</h2>

            <div class="weather-icon" id="weatherIcon">
                🌤️
            </div>

            <h3 id="temperature">-- °C</h3>

            <p id="description">
                Weather information will appear here
            </p>


            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">-- %</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="windSpeed">-- km/h</strong>
                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Weather App
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
